name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Client-only build. We intentionally skip the full "npm run build"
      # script here since that also bundles server.ts (the Express server),
      # which the packaged native app doesn't need or run.
      - name: Build web assets
        run: npx vite build

      # The android/ folder isn't committed to the repo, so we generate it
      # fresh each run. If you later commit android/ yourself, this step
      # becomes a no-op and is safe to leave in place.
      - name: Add Android platform (first run only)
        run: test -d android || npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
